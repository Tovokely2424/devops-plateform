apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: rng-deployment
  name: rng-deployment
spec:
  replicas: 1 
  selector:
    matchLabels:
      app: rng
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: rng
    spec:
      containers:
      - image: localhost:32000/rng:v1.0
        name: rng
        ports:
        - containerPort: 80
          name: http
