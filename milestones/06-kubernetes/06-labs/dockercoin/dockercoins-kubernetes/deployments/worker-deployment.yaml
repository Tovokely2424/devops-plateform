apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: worker-deployment
  name: worker-deployment
spec:
  replicas: 3 
  selector:
    matchLabels:
      app: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - image: localhost:32000/worker:v1
        name: worker
