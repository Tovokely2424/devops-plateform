apiVersion: v1
kind: Pod
metadata:
  name: db 
  labels:
    app: db
spec:
  containers:
  - name: db
    image: postgres:9.4
    env:
      - name: POSTGRES_USER
        value: postgres
      - name: POSTGRES_PASSWORD
        value: postgres
    ports:
      - containerPort: 5432
        name: postgres-port